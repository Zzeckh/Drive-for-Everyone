                    "surface-variant": "#e5e2e1",
                    "inverse-primary": "#a6d700",
                    "inverse-surface": "#313030",
                    "surface-bright": "#fcf9f8",
                    "secondary": "#006875",
                    "on-tertiary": "#ffffff",
                    "primary-fixed-dim": "#a6d700",
                    "on-tertiary-container": "#b63199",
                    "primary": "#4e6700",
                    "secondary-fixed-dim": "#00daf3",
                    "tertiary-fixed-dim": "#ffade2",
                    "on-tertiary-fixed": "#3b0030",
                    "on-primary": "#ffffff",
                    "on-primary-fixed-variant": "#3a4d00",
                    "surface-container-high": "#eae7e7",
                    "error-container": "#ffdad6",
                    "secondary-fixed": "#9cf0ff",
                    "on-error": "#ffffff",
                    "background": "#fcf9f8",
                    "tertiary": "#a7228c",
                    "secondary-container": "#00e3fd",
                    "on-background": "#1c1b1b",
                    "on-surface": "#1c1b1b",

                    "inverse-on-surface": "#f3f0ef",
                    "surface-container-lowest": "#ffffff",
                    "error": "#ba1a1a",
                    "surface-container-highest": "#e5e2e1",
                    "surface": "#fcf9f8",
                    "surface-container-low": "#f6f3f2",
                    "tertiary-fixed": "#ffd8ee",
                    "on-primary-container": "#587300",
                    "on-secondary-fixed": "#001f24",
                    "surface-tint": "#4e6700",
                    "tertiary-container": "#ffe5f2",
                    "primary-container": "#c6ff00"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",

    <style>
      .neo-shadow { box-shadow: 8px 8px 0px 0px rgba(0,0,0,1); }
      .neo-shadow-sm { box-shadow: 4px 4px 0px 0px rgba(0,0,0,1); }
      .neo-border { border: 2px solid #1c1b1b; }
      .neo-border-thick { border: 4px solid #1c1b1b; }

      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 700, 'GRAD' 0, 'opsz' 24;
      }

      /* Body khusus saat layar landing aktif */
      .landing-body {
        background: #f8f8f0;
        color: #1c1b1b;
        font-family: 'Work Sans', system-ui, sans-serif;
      }

      /* Mobile menu animation */
      .mobile-menu {
        transition: transform 0.3s ease-in-out;
      }

      .mobile-menu.hidden {
        transform: translateX(-100%);
      }

      .mobile-menu.open {
        transform: translateX(0);
      }

      /* Bottom nav for mobile (khusus landing) */
      @media (max-width: 767px) {
        .bottom-nav {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          z-index: 40;
        }

        body.landing-body {
          padding-bottom: 80px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
